<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 870" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="920" height="870" fill="#ffffff"/>

  <!-- Control Layer -->
  <rect x="20" y="20" width="880" height="140" rx="14" fill="#eef4ff" stroke="#c7d8f5"/>
  <text x="460" y="46" text-anchor="middle" font-size="13" fill="#7889a8" font-weight="500">제어 레이어 (Control Layer · User Desktop)</text>
  <rect x="290" y="64" width="340" height="84" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="460" y="92" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="700">Electron 데스크탑 앱</text>
  <text x="460" y="113" text-anchor="middle" font-size="11" fill="#6b7280">Windows .exe  ·  macOS .dmg  ·  Linux .AppImage</text>
  <text x="460" y="132" text-anchor="middle" font-size="11" fill="#6b7280">3-Panel UI · Agents / Chat / Terminal · Setup Wizard</text>

  <!-- Arrow 1: Control → Server -->
  <line x1="460" y1="170" x2="460" y2="222" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="365" y="178" width="190" height="22" rx="11" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="460" y="194" text-anchor="middle" font-size="11" fill="#1e3a8a" font-weight="500">HTTP + WebSocket · SSH 터널</text>

  <!-- Server Layer -->
  <rect x="20" y="240" width="880" height="510" rx="14" fill="#eef4ff" stroke="#c7d8f5"/>
  <text x="460" y="266" text-anchor="middle" font-size="13" fill="#7889a8" font-weight="500">서버 (Node.js) · 로컬 머신 또는 원격 SSH 호스트</text>

  <!-- Server services row -->
  <rect x="40" y="284" width="270" height="84" rx="10" fill="#ffffff" stroke="#dadce0" filter="url(#shadow)"/>
  <text x="175" y="311" text-anchor="middle" font-size="13" fill="#111827" font-weight="600">WebSocket Hub</text>
  <text x="175" y="332" text-anchor="middle" font-size="10.5" fill="#6b7280">메시지 라우팅 · 다중 세션</text>
  <text x="175" y="350" text-anchor="middle" font-size="10.5" fill="#6b7280">팀/워커 변경 broadcast</text>

  <rect x="325" y="284" width="270" height="84" rx="10" fill="#ffffff" stroke="#dadce0" filter="url(#shadow)"/>
  <text x="460" y="311" text-anchor="middle" font-size="13" fill="#111827" font-weight="600">Session Store</text>
  <text x="460" y="332" text-anchor="middle" font-size="10.5" fill="#6b7280">data/agents.json (3팀 자동 시드)</text>
  <text x="460" y="350" text-anchor="middle" font-size="10.5" fill="#6b7280">data/sessions/&lt;uuid&gt;.jsonl 히스토리</text>

  <rect x="610" y="284" width="270" height="84" rx="10" fill="#ffffff" stroke="#dadce0" filter="url(#shadow)"/>
  <text x="745" y="311" text-anchor="middle" font-size="13" fill="#111827" font-weight="600">PTY Shell</text>
  <text x="745" y="332" text-anchor="middle" font-size="10.5" fill="#6b7280">@lydell/node-pty · ConPTY / PTY</text>
  <text x="745" y="350" text-anchor="middle" font-size="10.5" fill="#6b7280">xterm.js 패널 양방향 스트림</text>

  <!-- Orchestrator -->
  <rect x="40" y="390" width="840" height="78" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="460" y="417" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="700">오케스트레이터 — Claude Code CLI (claude -p --output-format stream-json)</text>
  <text x="460" y="439" text-anchor="middle" font-size="11" fill="#6b7280">동적 시스템 프롬프트로 팀/워크플로 인식 · &lt;plan&gt;...&lt;/plan&gt; 태그로 라우팅 미리보기 출력</text>
  <text x="460" y="457" text-anchor="middle" font-size="11" fill="#6b7280">Task tool로 worker subagent 호출 (worker도 각각 별도 claude -p 프로세스)</text>

  <!-- Teams row -->
  <rect x="40" y="490" width="270" height="245" rx="10" fill="#ffffff" stroke="#dadce0" filter="url(#shadow)"/>
  <text x="175" y="515" text-anchor="middle" font-size="13" fill="#111827" font-weight="600">coding-team</text>
  <text x="175" y="533" text-anchor="middle" font-size="10" fill="#6b7280">PLAN → IMPL → REVIEW → FIX LOOP</text>
  <rect x="55" y="546" width="240" height="32" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="175" y="567" text-anchor="middle" font-size="11.5" fill="#374151">planner</text>
  <rect x="55" y="585" width="240" height="32" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="175" y="606" text-anchor="middle" font-size="11.5" fill="#374151">coder</text>
  <rect x="55" y="624" width="240" height="32" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="175" y="645" text-anchor="middle" font-size="11.5" fill="#374151">reviewer</text>

  <rect x="325" y="490" width="270" height="245" rx="10" fill="#ffffff" stroke="#dadce0" filter="url(#shadow)"/>
  <text x="460" y="515" text-anchor="middle" font-size="13" fill="#111827" font-weight="600">ui-team</text>
  <text x="460" y="533" text-anchor="middle" font-size="10" fill="#6b7280">PLAN → DESIGN → IMPL → REVIEW</text>
  <rect x="340" y="546" width="240" height="32" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="460" y="567" text-anchor="middle" font-size="11.5" fill="#374151">planner</text>
  <rect x="340" y="585" width="240" height="32" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="460" y="606" text-anchor="middle" font-size="11.5" fill="#374151">designer</text>
  <rect x="340" y="624" width="240" height="32" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="460" y="645" text-anchor="middle" font-size="11.5" fill="#374151">coder</text>
  <rect x="340" y="663" width="240" height="32" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="460" y="684" text-anchor="middle" font-size="11.5" fill="#374151">reviewer</text>

  <rect x="610" y="490" width="270" height="245" rx="10" fill="#ffffff" stroke="#dadce0" filter="url(#shadow)"/>
  <text x="745" y="515" text-anchor="middle" font-size="13" fill="#111827" font-weight="600">research-team</text>
  <text x="745" y="533" text-anchor="middle" font-size="10" fill="#6b7280">증거 기반 조사 · file:line 인용</text>
  <rect x="625" y="546" width="240" height="32" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="745" y="567" text-anchor="middle" font-size="11.5" fill="#374151">code-explorer (researcher)</text>
  <rect x="625" y="585" width="240" height="32" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="745" y="606" text-anchor="middle" font-size="11.5" fill="#374151">docs-researcher (researcher)</text>

  <!-- Bottom external resources -->
  <rect x="20" y="775" width="205" height="70" rx="10" fill="#ffffff" stroke="#dadce0" filter="url(#shadow)"/>
  <text x="122" y="803" text-anchor="middle" font-size="12.5" fill="#111827" font-weight="600">Anthropic API</text>
  <text x="122" y="824" text-anchor="middle" font-size="10" fill="#6b7280">본인 Claude 구독으로 호출</text>

  <rect x="245" y="775" width="205" height="70" rx="10" fill="#ffffff" stroke="#dadce0" filter="url(#shadow)"/>
  <text x="347" y="803" text-anchor="middle" font-size="12.5" fill="#111827" font-weight="600">파일시스템 (Workspace)</text>
  <text x="347" y="824" text-anchor="middle" font-size="10" fill="#6b7280">CLAUDE_CWD 폴더</text>

  <rect x="470" y="775" width="205" height="70" rx="10" fill="#ffffff" stroke="#dadce0" filter="url(#shadow)"/>
  <text x="572" y="803" text-anchor="middle" font-size="12.5" fill="#111827" font-weight="600">Git 저장소</text>
  <text x="572" y="824" text-anchor="middle" font-size="10" fill="#6b7280">워커가 Bash로 git 명령</text>

  <rect x="695" y="775" width="205" height="70" rx="10" fill="#ffffff" stroke="#dadce0" filter="url(#shadow)"/>
  <text x="797" y="803" text-anchor="middle" font-size="12.5" fill="#111827" font-weight="600">MCP 서버</text>
  <text x="797" y="824" text-anchor="middle" font-size="10" fill="#6b7280">선택적 외부 도구 연결</text>
</svg>
