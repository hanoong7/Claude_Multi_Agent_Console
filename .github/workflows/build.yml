name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Opt into Node.js 24 for all JS-based actions. Node 20 actions are
# deprecated; the default flips to Node 24 on 2026-06-02. We turn it on
# early so the deprecation warning is silenced and we know things still
# build before the forced switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist-installers/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist-installers/*.AppImage

  macos:
    # macos-latest is Apple Silicon, so this produces an arm64 .dmg.
    # Intel Macs are not supported (per project decision).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist-installers/*.dmg

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-portable/*.exe
            artifacts/linux-appimage/*.AppImage
            artifacts/macos-dmg/*.dmg
